<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="BanGuide offline fallback page.">
  <title>Offline — BanGuide</title>
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a2126">
  <script>
    // Apply the saved (or system) theme before styles paint to avoid a flash.
    (function () {
      var stored = null;
      try { stored = localStorage.getItem('banguide_theme_v1'); } catch (e) {}
      var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = (stored === 'light' || stored === 'dark') ? stored : (dark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) {
        meta.setAttribute('content', theme === 'dark' ? '#1a2126' : '#ffffff');
        meta.removeAttribute('media');
      }
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="alternate icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <header class="page-header">
    <h1 class="page-header-title">You are offline</h1>
    <p class="page-header-subtitle">This page has not been cached yet.</p>
  </header>

  <main class="page">
    <section class="error-state" style="background-color: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md);">
      <h2 class="error-heading" style="color: var(--color-text);">Reconnect to continue</h2>
      <p>Reconnect to the internet and revisit this page once to store it for offline use.</p>
      <p style="margin-top: var(--space-sm);">Previously visited pages should still work while offline.</p>
      <p style="margin-top: var(--space-lg);"><a href="index.html" class="back-nav" style="margin: 0;">Back to courses</a></p>
    </section>
  </main>
</body>
</html>
